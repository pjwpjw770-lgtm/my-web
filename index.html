
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Proxy Hub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px 50px;
      font-family: Arial, sans-serif;
      background: #101522;
      color: #ffffff;
    }

    header {
      text-align: center;
      padding: 25px 10px;
    }

    header h1 {
      font-size: 32px;
      margin: 0 0 10px;
      background: linear-gradient(90deg, #70a1ff, #a29bfe);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    header p {
      color: #aab4cc;
      font-size: 14px;
    }

    .container {
      max-width: 520px;
      margin: 24px auto;
      padding: 26px;
      border: 1px solid #303b52;
      border-radius: 20px;
      background: #1a2233;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.2);
    }

    .tag {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      background: #303b52;
      color: #dce5ff;
    }

    h2 {
      font-size: 25px;
      margin: 14px 0 8px;
    }

    .description {
      color: #aab4cc;
      font-size: 14px;
      line-height: 1.7;
    }

    input {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #46536d;
      border-radius: 11px;
      background: #0e1421;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #70a1ff;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 15px;
      border: none;
      border-radius: 11px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #4263eb;
    }

    button:hover {
      filter: brightness(1.12);
    }

    .orb button {
      background: #16836b;
    }

    .divider {
      max-width: 520px;
      margin: 35px auto;
      border: none;
      border-top: 1px solid #303b52;
    }

    footer {
      max-width: 520px;
      margin: 30px auto 0;
      text-align: center;
      color: #8792aa;
      font-size: 12px;
      line-height: 1.8;
    }
  </style>
</head>

<body>

  <header>
    <h1>My Proxy Hub</h1>
    <p>シンプルなWebランチャー</p>
  </header>

  <!-- Proxyium -->
  <section class="container">
    <span class="tag">PROXY 01</span>
    <h2>Proxyium</h2>
    <p class="description">
      URLを入力してProxyium経由で開く
    </p>

    <form id="proxyiumForm">
      <input
        id="proxyiumInput"
        type="text"
        placeholder="google.com"
        autocomplete="url"
        required
      >
      <button type="submit">Proxyiumで開く ↗</button>
    </form>
  </section>

  <hr class="divider">

  <!-- ProxyOrb -->
  <section class="container orb">
    <span class="tag">PROXY 02</span>
    <h2>ProxyOrb</h2>
    <p class="description">
      URLを入力してProxyOrbを開く
    </p>

    <form id="proxyorbForm">
      <input
        id="proxyorbInput"
        type="text"
        placeholder="google.com"
        autocomplete="url"
        required
      >
      <button type="submit">ProxyOrbを開く ↗</button>
    </form>
  </section>

  <footer>
    My Proxy Hub<br>
    URLを入力して各サービスを利用できます。
    プロキシサービスに個人情報やパスワードを入力しないでください。
  </footer>

  <script>
    function normalizeUrl(value) {
      let text = value.trim();

      if (!/^https?:\/\//i.test(text)) {
        text = "https://" + text;
      }

      const url = new URL(text);

      if (
        url.protocol !== "https:" &&
        url.protocol !== "http:"
      ) {
        throw new Error("Invalid URL");
      }

      return url.href;
    }

    // Proxyium
    document
      .getElementById("proxyiumForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();

        try {
          const target = normalizeUrl(
            document.getElementById("proxyiumInput").value
          );

          const bytes = new TextEncoder().encode(target);
          let binary = "";

          for (const byte of bytes) {
            binary += String.fromCharCode(byte);
          }

          const encoded = btoa(binary)
            .replace(/\+/g, "-")
            .replace(/\//g, "_")
            .replace(/=+$/g, "");

          const proxyUrl =
            "https://185.16.38.122/?__cpo=" +
            encodeURIComponent(encoded);

          window.open(
            proxyUrl,
            "_blank",
            "noopener,noreferrer"
          );
        } catch (error) {
          alert("URLを確認してください。");
        }
      });

    // ProxyOrb
    document
      .getElementById("proxyorbForm")
      .addEventListener("submit", async function(event) {
        event.preventDefault();

        let target;

        try {
          target = normalizeUrl(
            document.getElementById("proxyorbInput").value
          );
        } catch (error) {
          alert("URLを確認してください。");
          return;
        }

        // 新しいタブを開き、入力URLをコピーする
        window.open(
          "https://proxyorb.com/ja",
          "_blank"
        );

        try {
          await navigator.clipboard.writeText(target);
          alert(
            "入力したURLをコピーしました！\n" +
            "ProxyOrbの入力欄に貼り付けてください。"
          );
        } catch (error) {
          prompt("このURLをコピーしてください：", target);
        }
      });
  </script>

</body>
</html>
